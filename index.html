<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conways Game of Life</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <!-- werkbank: hochkant untereinander, quer Canvas links und Bedienung rechts (style.css) -->
    <main class="seite werkbank">
      <header class="projekt-kopf">
        <h1>Conways Game of Life</h1>
        <ul class="tags">
          <li>simulation</li>
          <li>projekt</li>
        </ul>
      </header>

      <div class="canvas-wrapper">
        <canvas id="grid"></canvas>
      </div>

      <div class="bedienung">
        <div class="steuerung">
          <button type="button" id="simulationBtn">Stoppen</button>
          <button type="button" id="leerBtn">Leeren</button>
          <button type="button" id="zufallBtn">Zufall</button>
        </div>
        <div class="steuerung">
          <label>Nachbar zum Leben 1 <input type="number" id="nachbar1" min="0" max="8" step="1"></label>
          <label>Nachbar zum Leben 2 <input type="number" id="nachbar2" min="0" max="8" step="1"></label>
          <label>Nachbar zum Beleben <input type="number" id="nachbar3" min="1" max="8" step="1"></label>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
